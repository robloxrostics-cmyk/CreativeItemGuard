# Защита контейнеров и верстака (в креативе).
containers:
  block-open: true
  block-break: true
  block-types:
    - CHEST
    - TRAPPED_CHEST
    - ENDER_CHEST
    - BARREL
  block-crafting-table: true
  block-shulkers: true
  block-drop: true

# Нарушения и предупреждения. Счётчик хранится в plugins/CreativeItemGuard/data.yml.
punishments:
  warning-limit: 10
  violation-cooldown-seconds: 3
  notify-admins: true

# LiteBans: команда выполняется от консоли. Проверьте синтаксис warn для вашей версии LiteBans.
litebans:
  enabled: false
  warn-command: "litebans:warn %player% Нарушение CreativeItemGuard: %reason%"

# LuckPerms: автоматически снимается группа с наибольшим весом.
# Защищённые группы никогда не снимаются — укажите здесь все staff/системные группы.
luckperms:
  enabled: true
  excluded-groups:
    - default
    - owner
    - admin
    - moderator
    - helper

messages:
  blocked: "&cЭтот предмет запрещён в креативе!"
  reloaded: "&aКонфигурация CreativeItemGuard перезагружена."
  warning: "&cПредупреждение за нарушение! &7(%count%/%limit%)"
  admin-violation: "&8[&6CIG&8] &e%player% &7: &f%reason%"
  creative-disabled: "&cВаши возможности креатива ограничены администрацией. Полёт доступен."
  creative-enabled: "&aОграничения креатива сняты."
  privilege-removed: "&cЗа достижение лимита предупреждений ваша привилегия снята."
