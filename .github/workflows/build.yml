
name: Build CreativeItemGuard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: CreativeItemGuard-source/pom.xml

      - name: Build plugin
        working-directory: CreativeItemGuard-source
        run: mvn clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CreativeItemGuard-JAR
          path: CreativeItemGuard-source/target/*.jar
